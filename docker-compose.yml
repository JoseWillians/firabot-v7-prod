services:
  mysql:
    image: mysql:8.0
    container_name: firabot-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-firabot}
      MYSQL_USER: ${MYSQL_USER:-firabot}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-firabot123}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - firabot_mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u\"$${MYSQL_USER}\" -p\"$${MYSQL_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  firabot_mysql_data:
